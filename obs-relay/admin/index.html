<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OBS Cameras</title>
<style>
  :root{color-scheme:dark}
  body{margin:0;font-family:system-ui,sans-serif;background:#080e18;color:#e5eefb;min-height:100vh}
  h1{margin:0;font-size:16px;font-weight:600}
  .header{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid rgba(255,255,255,.08);flex-wrap:wrap}
  .obs-dot{width:10px;height:10px;border-radius:50%;display:inline-block}
  .obs-dot.ok{background:#4ade80}
  .obs-dot.ko{background:#ef4444}
  .grid{display:flex;flex-wrap:wrap;gap:12px;padding:16px}
  .card{flex:1 1 280px;border-radius:14px;padding:16px;display:flex;align-items:center;gap:14px;min-width:0;transition:opacity .3s;background:#0f1729;border:1px solid rgba(255,255,255,.08)}
  .card.stale{opacity:.4}
  .dot{width:32px;height:32px;border-radius:50%;flex-shrink:0}
  .dot.PROGRAM{background:#ef4444;box-shadow:0 0 20px #ef444488}
  .dot.PREVIEW{background:#f59e0b;box-shadow:0 0 20px #f59e0b88}
  .dot.IDLE{background:#4ade80}
  .dot.offline{background:#475569}
  .info{min-width:0}
  .name{font-size:18px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .status{font-size:13px;margin-top:2px;font-weight:600}
  .status.PROGRAM{color:#ef4444}
  .status.PREVIEW{color:#f59e0b}
  .status.IDLE{color:#4ade80}
  .status.offline{color:#94a3b8}
  .small{font-size:11px;color:#64748b;margin-top:4px;word-break:break-all}
  .empty{text-align:center;padding:60px 16px;color:#94a3b8;width:100%}
  .empty h2{font-size:18px;margin:0 0 8px;color:#64748b}
  .director{display:flex;align-items:center;gap:16px;padding:16px;border-bottom:1px solid rgba(255,255,255,.08)}
  .director-mic{width:220px;height:72px;border:0;border-radius:12px;background:#ef4444;color:#fff;font-size:20px;font-weight:800;cursor:pointer;box-shadow:0 8px 24px #ef444455;user-select:none;touch-action:none}
  .director-mic.active{background:#22c55e;box-shadow:0 8px 24px #22c55e55}
  .director-status{color:#94a3b8;font-size:13px}

</style>
</head>
<body>
<div class="header"><span class="obs-dot" id="obsDot"></span><h1 id="obsLabel">Connecting...</h1><span style="font-size:13px;color:#64748b" id="countLabel"></span><span style="font-size:12px;color:#94a3b8;margin-left:auto" id="relayLabel"></span></div>
<div class="director"><button class="director-mic" id="directorMic">Hold to speak to all phones</button><span class="director-status" id="directorStatus">Ready</span></div>
<div class="grid" id="grid"></div>
<script>
// ponytail: single-file status panel, SSE primary + setInterval fallback, zero deps
const grid=document.getElementById('grid'),obsDot=document.getElementById('obsDot'),obsLabel=document.getElementById('obsLabel'),countLabel=document.getElementById('countLabel'),relayLabel=document.getElementById('relayLabel');
const LABELS={PROGRAM:'LIVE',PREVIEW:'PREVIEW',IDLE:'READY'};

function render(data){
  if(!data)return;
  const ok=!!data.connected;
  obsDot.className='obs-dot '+(ok?'ok':'ko');
  obsLabel.textContent=ok?'OBS Connected · '+(data.programScene||'?')+(data.previewScene?' / Preview: '+data.previewScene:''):'OBS Disconnected';
  const list=data.devices||[];
  countLabel.textContent=list.length+' camera'+(list.length!==1?'s':'');
  relayLabel.textContent=data.relayAddress?'Relay: '+data.relayAddress+':3000':'';
  if(!list.length){grid.innerHTML='<div class="empty"><h2>No cameras registered</h2><p>Phones will appear here once they register with the relay.</p></div>';return}
  grid.innerHTML=list.map(d=>{
    const state=d.state||'IDLE';
    const fresh=d.fresh!==false;
    const dotClass=fresh?state:'offline';
    const label=fresh?LABELS[state]||'READY':'NO SIGNAL';
    const streamUrl=(d.url||'').trim().replace(/\/+$/,'');
    const streamLink=streamUrl?'<a href="'+streamUrl+'/stream.mjpg" target="_blank" rel="noopener">stream.mjpg</a>':(d.name||d.sourceName||'');
    const lat=d.latencyMs; const latStr=lat!=null?(lat<1?'<1ms':lat<10?lat+'ms':Math.round(lat)+'ms'):'?';
    const bat=d.batteryLevel>=0?d.batteryLevel+'%':'';
    return '<div class="card'+(fresh?'':' stale')+'"><div class="dot '+dotClass+'"></div><div class="info"><div class="name">'+(d.sourceName||'?')+'</div><div class="status '+dotClass+'">'+label+'</div><div class="small">'+(streamLink?streamLink+' · ':'')+latStr+(bat?' · '+bat:'')+'</div></div></div>'
  }).join('');
}

function fetchData(){fetch('/api/diagnostics').then(r=>r.json()).then(render).catch(()=>{})}
const directorMic=document.getElementById('directorMic'),directorStatus=document.getElementById('directorStatus');
let directorAudio=null,directorStream=null,directorNode=null,directorSending=Promise.resolve();
function stopDirectorMic(){
  directorNode?.disconnect(); directorNode=null;
  directorStream?.getTracks().forEach(t=>t.stop()); directorStream=null;
  directorMic.classList.remove('active'); directorMic.textContent='Hold to speak to all phones'; directorStatus.textContent='Ready';
}
directorMic.onpointerdown=async (event)=>{
  event.preventDefault();
  if(directorNode)return;
  try{
    directorAudio=directorAudio||new AudioContext({sampleRate:44100});
    await directorAudio.resume();
    directorStream=await navigator.mediaDevices.getUserMedia({audio:true});
    directorMic.classList.add('active'); directorMic.textContent='Speaking to all phones'; directorStatus.textContent='Release to stop';
    const source=directorAudio.createMediaStreamSource(directorStream);
    directorNode=directorAudio.createScriptProcessor(2048,1,1);
    directorNode.onaudioprocess=(event)=>{
      const input=event.inputBuffer.getChannelData(0),pcm=new Int16Array(input.length);
      for(let i=0;i<input.length;i++)pcm[i]=Math.max(-32768,Math.min(32767,input[i]*32768*1.5));
      const data=btoa(String.fromCharCode(...new Uint8Array(pcm.buffer)));
      directorSending=directorSending.then(()=>fetch('/api/audio/broadcast',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({data})})).catch(()=>{});
    };
    source.connect(directorNode); directorNode.connect(directorAudio.destination);
  }catch(error){directorStatus.textContent='Microphone unavailable';console.error('director-mic',error)}
};
directorMic.onpointerup=directorMic.onpointercancel=stopDirectorMic;
// ponytail: SSE primary, 10s poll fallback — never stale, no reconnect logic
const es=new EventSource('/events');
es.addEventListener('state',e=>{try{render(JSON.parse(e.data))}catch(_){}});
es.onerror=()=>{};
setInterval(fetchData,10000);
fetchData();

</script>
</body>
</html>
